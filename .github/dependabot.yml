version: 2
updates:
  # Update PHP / Symfony (Composer) dependencies
  - package-ecosystem: "composer"
    directory: "/symfony"
    schedule:
      interval: "weekly" # "daily", "weekly", "monthly"
      day: "monday"
    open-pull-requests-limit: 10
    target-branch: "dev"
    labels:
      - "dependencies"
      - "php"

  # Update Docker images
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    target-branch: "dev"
    labels:
      - "dependencies"
      - "docker"

  # Update GitHub Actions (Workflows CI/CD)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    labels:
      - "dependencies"
      - "ci"