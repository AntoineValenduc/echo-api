services:
    server_sf:
        container_name: server_sf
        image: nginx:1.31.2-alpine3.23
        working_dir: /www
        volumes:
            - "./symfony:/www/symfony"
            - "./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
        ports:
            - "8080:80"

    php_composer:
        container_name: php_composer
        build:
            context: ./docker/php/
            #param par défaut
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        working_dir: /www/symfony
        volumes:
            - "./symfony/:/www/symfony"
        env_file:
            - ./symfony/.env.dev

    postgres_sy:
        container_name: postgres_sy
        image: postgres:18.6-alpine3.24
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - "pgsql_dev:/var/lib/postgresql"
        ports:
            - "5432:5432"

    postgres_sy_test:
        container_name: postgres_sy_test
        image: postgres:18.6-alpine3.24
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}_test
        volumes:
            - "pgsql_test:/var/lib/postgresql"
        ports:
            - "5433:5432"

    postgres_keycloak:
        container_name: pgsql_keycloak
        image: postgres:18.6-alpine3.24
        environment:
            POSTGRES_USER: ${POSTGRES_KEYCLOAK_USER}
            POSTGRES_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
            POSTGRES_DB: ${POSTGRES_KEYCLOAK_DB}
        volumes:
            - pgsql_keycloak:/var/lib/postgresql
        ports:
          - "5434:5432"
    redis:
        container_name: redis
        image: redis:8-alpine
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        command: redis-server --appendonly yes

    keycloak:
        image: quay.io/keycloak/keycloak:26.8
        container_name: keycloak_service
        command: start-dev --import-realm
        environment:
            KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
            KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
            KC_DB: postgres
            KC_DB_URL: jdbc:postgresql://pgsql_keycloak:5432/${POSTGRES_KEYCLOAK_DB}
            KC_DB_USERNAME: ${POSTGRES_KEYCLOAK_USER}
            KC_DB_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
            KC_HEALTH_ENABLED: "true"
            KC_METRICS_ENABLED: "true"
        ports:
        - "${KEYCLOAK_PORT}:8080"
        depends_on:
        - postgres_keycloak

    prometheus:
        container_name: prometheus
        image: prom/prometheus:latest
        restart: unless-stopped
        ports:
            - "9090:9090"
        volumes:
            - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        profiles:
            - monitoring

    grafana:
        container_name: grafana
        image: grafana/grafana:latest
        restart: unless-stopped
        ports:
        - "3000:3000"
        environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: admin
        volumes:
            - grafana_data:/var/lib/grafana
        depends_on:
            - prometheus
        profiles:
            - monitoring


    # Monitoring for Prometheus/Grafana
    cadvisor:
        image: gcr.io/cadvisor/cadvisor:latest
        container_name: cadvisor
        restart: unless-stopped
        ports:
            - "8082:8080"
        volumes:
            - /:/rootfs:ro
            - /var/run:/var/run:ro
            - /sys:/sys:ro
            - /var/lib/docker/:/var/lib/docker:ro
        profiles:
            - monitoring

    node_exporter:
        image: prom/node-exporter:latest
        container_name: node_exporter
        ports:
            - "9100:9100"
        profiles:
            - monitoring

    postgres_exporter:
        image: prometheuscommunity/postgres-exporter
        container_name: postgres_exporter
        environment:
            DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_sy:5432/${POSTGRES_DB}?sslmode=disable"
        ports:
            - "9187:9187"
        profiles:
            - monitoring

    redis_exporter:
        image: oliver006/redis_exporter
        container_name: redis_exporter
        environment:
            REDIS_ADDR: redis://redis:6379
        ports:
            - "9121:9121"
        profiles:
            - monitoring

    nginx_exporter:
        image: nginx/nginx-prometheus-exporter:latest
        command:
            - -nginx.scrape-uri=http://server_sf/nginx_status
        ports:
            - "9113:9113"
        profiles:
            - monitoring

    #Sonar
    sonarqube:
        image: sonarqube:community
        container_name: sonarqube
        ports:
            - "9000:9000"
        environment:
            SONAR_JDBC_URL: jdbc:postgresql://sonar_db:5432/${POSTGRES_SONAR_DB}
            SONAR_JDBC_USERNAME: ${SONAR_JDBC_USERNAME}
            SONAR_JDBC_PASSWORD: ${SONAR_JDBC_PASSWORD}
            SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
        volumes:
            - sonar_data:/opt/sonarqube/data
            - sonar_logs:/opt/sonarqube/logs
            - sonar_extensions:/opt/sonarqube/extensions
        depends_on:
            - sonar_db
        profiles:
            - quality

    sonar_db:
        image: postgres:18.6-alpine3.24
        container_name: sonar_db
        environment:
            POSTGRES_USER: ${POSTGRES_SONAR_USER}
            POSTGRES_PASSWORD: ${POSTGRES_SONAR_PASSWORD}
            POSTGRES_DB: ${POSTGRES_SONAR_DB}
        volumes:
            - sonar_pgsql:/var/lib/postgresql
        profiles:
            - quality

volumes:
    pgsql_dev:
        driver: local
    pgsql_test:
        driver: local
    pgsql_keycloak:
        driver: local
    redis_data:
        driver: local
    prometheus_data:
        driver: local
    grafana_data:
        driver: local
    sonar_data:
        driver: local
    sonar_logs:
        driver: local
    sonar_extensions:
        driver: local
    sonar_pgsql:
        driver: local