services:
    server_sf:
        container_name: server_sf
        image: nginx:1.31.1-alpine3.23
        working_dir: /www
        volumes:
            - "./symfony:/www/symfony"
            - "./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
        ports:
            - "8080:80"

    php_composer:
        container_name: php_composer
        build:
            context: ./docker/php/
            #param par défaut
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        working_dir: /www/symfony
        volumes:
            - "./symfony/:/www/symfony"
        env_file:
            - ./symfony/.env.dev

    postgres_sy:
        container_name: postgres_sy
        image: postgres:18.4-alpine3.24
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - "pgsql_dev:/var/lib/postgresql"
        ports:
            - "5432:5432"

    postgres_sy_test:
        container_name: postgres_sy_test
        image: postgres:18.4-alpine3.24
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}_test
        volumes:
            - "pgsql_test:/var/lib/postgresql"
        ports:
            - "5433:5432"

    redis:
        container_name: redis
        image: redis:8-alpine
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        command: redis-server --appendonly yes

volumes:
    pgsql_dev:
        driver: local
    pgsql_test:
        driver: local
    redis_data:
        driver: local
